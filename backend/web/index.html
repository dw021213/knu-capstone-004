<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제주 위험도 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .panel {
      background: #fff; padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 13px; line-height: 1.5;
    }
    .panel h4 { margin: 0 0 6px; font-size: 14px; }
    .legend .scale { display: flex; gap: 8px; margin-bottom: 4px; }
    .legend .bar { width: 14px; height: 130px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .legend .ticks { display: flex; flex-direction: column; justify-content: space-between; height: 130px; }
    .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .muted { color: #666; font-size: 12px; }
    .popup table { border-collapse: collapse; }
    .popup td { padding: 1px 6px 1px 0; }
    .popup td:first-child { color: #666; }
    .controls label { display: block; cursor: pointer; }
    .controls .slot { margin: 6px 0 4px 18px; }
    .controls select, .controls button { font: inherit; }
    .controls input[type=range] { width: 160px; vertical-align: middle; }
    .cmp { margin: 4px 0 4px 18px; max-width: 300px; }
    .cmp .row { margin: 2px 0; }
    .cmp table { border-collapse: collapse; margin: 4px 0; }
    .cmp td { padding: 1px 4px 1px 0; white-space: nowrap; }
    .cmp input[type=number] { width: 58px; font: inherit; }
    .cmp .sum { margin-top: 6px; border-top: 1px solid #eee; padding-top: 4px; }
    .cmp .sum td { text-align: right; }
    .cmp .sum td:first-child { text-align: left; color: #666; }
    .cmp .presets { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
    .cmp .presets button { font-size: 12px; padding: 1px 6px; }
    .cmp .presets button.on { background: #333; color: #fff; }
    .cmp details summary { cursor: pointer; color: #333; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 위험도 점수(0~1) → 색 그라데이션. 각 등급 구간(0.2 간격)의 가운데에 기준색을 둔다.
// 등급 경계(0.2 간격)는 internal/geo/ems.go LevelFromScore 와 맞출 것.
const COLOR_STOPS = [
  [0.1, '#fffbe5'], [0.3, '#ffeeb3'], [0.5, '#fee08b'], [0.7, '#fc8d59'], [0.9, '#d73027'],
];
const LEVEL_LABELS = { 1: '매우 낮음', 2: '낮음', 3: '보통', 4: '높음', 5: '매우 높음' };

const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function scoreColor(score) {
  if (score == null) return '#ccc';
  const s = Math.max(COLOR_STOPS[0][0], Math.min(COLOR_STOPS.at(-1)[0], score));
  for (let i = 1; i < COLOR_STOPS.length; i++) {
    const [s1, c1] = COLOR_STOPS[i];
    if (s <= s1) {
      const [s0, c0] = COLOR_STOPS[i - 1];
      const t = (s - s0) / (s1 - s0);
      const [a, b] = [hexToRgb(c0), hexToRgb(c1)];
      return `rgb(${a.map((v, k) => Math.round(v + t * (b[k] - v))).join(',')})`;
    }
  }
  return COLOR_STOPS.at(-1)[1];
}
const GRADIENT_CSS = `linear-gradient(to top, ${COLOR_STOPS.map(([s, c]) => `${c} ${s * 100}%`).join(', ')})`;

// ?view=위도,경도,줌 으로 처음 보는 위치를 지정할 수 있다 (예: ?view=33.30,126.62,12)
const initView = (() => {
  const v = (new URLSearchParams(location.search).get('view') || '').split(',').map(Number);
  return v.length === 3 && v.every(Number.isFinite) ? { c: [v[0], v[1]], z: v[2] } : { c: [33.38, 126.55], z: 10 };
})();
const map = L.map('map', { preferCanvas: true }).setView(initView.c, initView.z);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

const fmtDist = m => m == null ? '-' : (m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m');

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' → HTTP ' + res.status);
  return res.json();
}

// 표시 모드: combined = 위험도(교통사고 도로 모델 + 기상 가산), compare = 시설 가산 기준 비교(실험), dummy = 백엔드 테스트용 더미
const state = { mode: 'combined', weather: true, meta: null, hour: null, date: null, wx: null, fall: null, features: [], cmp: null, cmpRes: new Map() };
const pad2 = n => String(n).padStart(2, '0');
// at(시각, KST) + 기상 가산 여부
const slotQuery = () => `?at=${state.date}T${pad2(state.hour)}:00&weather=${state.weather ? 'on' : 'off'}`;
const todayKST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const hourKST = () => new Date(Date.now() + 9 * 3600e3).getUTCHours();
const NO_DATA_COLOR = '#bdbdbd';

// 셀 색에 쓰는 0~1 값. 위험도는 셀 간 백분위(0~100, 기상 가산 반영)를 0~1 로. null 이면 "자료 없음".
const cellValue = p => state.mode === 'combined'
  ? (p.risk_percentile == null ? null : p.risk_percentile / 100)
  : p.dummy_score;

// ── 시설 가산 비교 (실험) ─────────────────────────────────────────────
// API 값은 바꾸지 않고, /api/grid 의 모델 점수와 safety_detail(시설별 거리·주행시간·개수)로 브라우저에서 다시 계산한다.
//   시설 점수 = clamp((0점 기준 − 값) / (0점 기준 − 만점 기준), 0, 1)   (config/safety_rules.json 과 같은 식)
//   지수 F = 켠 시설 점수의 평균,  가산 = α × (1 − F) [멀수록]  또는  α × F [가까울수록]
//   가산 후 = min(1, 모델 점수 + 가산). 기상 가산은 넣지 않는다(모델 점수끼리 비교).
const UNIT = { nearest_dist_m: 'm', nearest_drive_min: '분', count_k1: '개', count_in_cell: '개' };
const levelOf = p => p == null ? null : p >= 90 ? 5 : p >= 70 ? 4 : p >= 30 ? 3 : p >= 10 ? 2 : 1;
const lin = (v, full, zero) => v == null ? 0 : Math.max(0, Math.min(1, (zero - v) / (zero - full)));
const DIFF_COLORS = { '-2': '#2166ac', '-1': '#92c5de', '0': '#f2f2f2', '1': '#f4a582', '2': '#b2182b' };

function defaultCmpItems() {
  return Object.fromEntries(state.meta.safety.items.map(it => [it.key, { on: true, full: it.full_at, zero: it.zero_at }]));
}

function computeCompare() {
  const c = state.cmp, items = state.meta.safety.items, rows = [];
  for (const f of state.features) {
    const p = f.properties;
    const base = c.model === 'traffic' ? p.base_score : (p.fall_percentile == null ? null : p.fall_percentile / 100);
    if (base == null) continue;
    const parts = []; let sum = 0, n = 0;
    for (const it of items) {
      const o = c.items[it.key];
      if (!o.on) continue;
      const v = p.safety_detail?.[it.key]?.value;
      const sc = lin(v, o.full, o.zero);
      parts.push({ it, v, sc }); sum += sc; n++;
    }
    const F = n ? sum / n : 0;
    const bonus = c.alpha * (c.dir === 'far' ? 1 - F : F);
    rows.push({ h3: p.h3, base, F, bonus, s: Math.min(1, base + bonus), parts, n });
  }
  if (c.rank === 'rerank') {
    // 가산 후 점수로 셀 간 순위를 다시 매김 → 등급별 셀 비율(10/20/40/20/10%)은 그대로. 동점은 원래 점수 순
    const o = [...rows].sort((a, b) => a.s - b.s || a.base - b.base);
    o.forEach((r, i) => { r.pct = 100 * i / (o.length - 1); });
  } else {
    rows.forEach(r => { r.pct = 100 * r.s; }); // 지금 API 방식: 점수(0~1)를 그대로 백분위로
  }
  rows.forEach(r => { r.lv0 = levelOf(100 * r.base); r.lv1 = levelOf(r.pct); });
  state.cmpRes = new Map(rows.map(r => [r.h3, r]));
  return rows;
}

function compareSummary(rows) {
  const cnt = k => [1, 2, 3, 4, 5].map(l => rows.filter(r => r[k] === l).length);
  const c0 = cnt('lv0'), c1 = cnt('lv1');
  const up = rows.filter(r => r.lv1 > r.lv0).length, down = rows.filter(r => r.lv1 < r.lv0).length;
  const top0 = rows.filter(r => r.lv0 === 5), keep = top0.filter(r => r.lv1 === 5).length;
  const mean = rows.reduce((a, r) => a + r.bonus, 0) / (rows.length || 1);
  const maxed = rows.filter(r => r.n && r.bonus >= state.cmp.alpha - 1e-9).length;
  const fall = state.fall;
  const fallNote = state.cmp.model !== 'fall' ? '' : !fall || fall.status !== 'ok'
    ? `<div style="color:#c00">이 날짜 이전 넘어짐 예측 없음</div>`
    : `<div class="muted">넘어짐 예측 ${fall.prediction_date}${fall.stale ? ' (다른 날 예측)' : ''} · ${fall.data_quality}</div>`;
  return `${fallNote}<table>
    <tr><td>등급</td>${[1, 2, 3, 4, 5].map(l => `<td><b>${l}</b></td>`).join('')}</tr>
    <tr><td>가산 전</td>${c0.map(v => `<td>${v}</td>`).join('')}</tr>
    <tr><td>가산 후</td>${c1.map((v, i) => `<td${v !== c0[i] ? ' style="font-weight:bold"' : ''}>${v}</td>`).join('')}</tr>
  </table>
  <div>등급 바뀐 셀 <b>${up + down}</b> / ${rows.length} (${(100 * (up + down) / (rows.length || 1)).toFixed(1)}%) · ↑${up} ↓${down}</div>
  <div>원래 5등급 유지 <b>${top0.length ? Math.round(100 * keep / top0.length) : '-'}%</b> (${keep}/${top0.length})</div>
  <div>평균 가산 ${mean.toFixed(3)} · 최대 가산(α) 받은 셀 ${maxed}</div>`;
}

function comparePopup(h3) {
  const r = state.cmpRes.get(h3);
  if (!r) return `<div class="popup"><b>H3 ${h3}</b><br>${state.cmp.model === 'traffic' ? '도로 자료 없음' : '넘어짐 예측 없음'} — 비교 제외</div>`;
  const unit = it => UNIT[it.metric] ?? '';
  const rows = r.parts.map(({ it, v, sc }) =>
    `<tr><td>${it.label}</td><td>${v == null ? '-' : it.metric === 'nearest_dist_m' ? fmtDist(Math.round(v)) : v + unit(it)}</td><td>점수 ${sc.toFixed(2)}</td></tr>`).join('');
  const dir = state.cmp.dir === 'far' ? '1 − 지수' : '지수';
  return `<div class="popup"><b>H3 ${h3}</b> <span class="muted">${state.cmp.model === 'traffic' ? '교통사고' : '넘어짐·추락'}</span><table>
    <tr><td>가산 전</td><td colspan="2">${swatch(r.base)}${LEVEL_NAME(r.lv0)} · 점수 ${r.base.toFixed(3)}</td></tr>
    <tr><td>가산 후</td><td colspan="2">${swatch(r.pct / 100)}<b>${LEVEL_NAME(r.lv1)}</b> · 백분위 ${r.pct.toFixed(1)}</td></tr>
    <tr><td>가산</td><td colspan="2">${state.cmp.alpha.toFixed(2)} × (${dir}) = <b>+${r.bonus.toFixed(3)}</b> <span class="muted">(지수 ${r.F.toFixed(2)})</span></td></tr>
    ${rows}
  </table><div class="muted">실험 화면 · API 값과 다를 수 있음</div></div>`;
}

const LEVEL_NAME = l => ({ 5: '매우 높음', 4: '높음', 3: '보통', 2: '낮음', 1: '매우 낮음' })[l] ?? '-';
const swatch = v => `<i style="display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);background:${v == null ? NO_DATA_COLOR : scoreColor(v)}"></i>`;

// 팝업용 0~23시 순위 막대 (현재 시간대 강조)
// 셀의 도로자료 출처 (본섬 표준노드링크 / 우도·추자도 수치지도)
function roadSource(dt) {
  if (!dt || !dt.road_source || dt.road_source === 'no_mapped_road') return '';
  return dt.road_source === 'NGII_digital_map'
    ? `<br><span class="muted">수치지도 ${dt.island_map_year ?? ''} · 도로 형상만 사용</span>`
    : `<br><span class="muted">표준노드링크 ${dt.road_snapshot_date ?? ''}</span>`;
}

async function cellPopup(h3) {
  const d = await getJSON('/api/cells/' + h3 + slotQuery());
  const fs = d.facilities.fire_station || {};
  const fireRows = `
    <tr><td>119 도착</td><td>약 ${fs.nearest_drive_min ?? '-'}분 <span class="muted">(${fs.drive_source === 'osrm'
      ? `${fs.nearest_name ?? ''} · 도로 ${fmtDist(fs.nearest_road_m)}` : `직선 ${fmtDist(fs.nearest_dist_m)} 근사`})</span></td></tr>
    <tr><td>셀 내 119</td><td>${fs.count_in_cell ?? 0}곳 (인접 포함 ${fs.count_k1 ?? 0}곳)</td></tr>`;

  if (state.mode === 'combined') {
    const r = d.risk || {};
    const t = d.hazards.traffic;
    const pct = r.percentile, lvl = r.level;
    const formula = `모델 위험점수 ${r.base_score?.toFixed(3)}`;
    const bonus = r.weather_bonus ?? 0;
    const basePct = r.base_percentile;
    const riskRows = pct != null
      ? `<tr><td>위험도</td><td>${swatch(pct / 100)}<b>${LEVEL_NAME(lvl)}</b> · ${100 - pct < 0.1 ? '최상위' : `상위 ${(100 - pct).toFixed(1)}%`}</td></tr>
         <tr><td>구성</td><td>${formula}${bonus > 0 ? ` <b>+ 기상 ${bonus.toFixed(2)}</b> <span class="muted">(가산 전 상위 ${(100 - basePct).toFixed(1)}%)</span>` : ''}</td></tr>`
      : `<tr><td>위험도</td><td>${swatch(null)}<b>도로 자료 없음</b> <span class="muted">(안전하다는 뜻 아님)</span></td></tr>`;
    const w = d.weather || {};
    const m = w.metrics || {};
    const obsText = [m.temp != null && `${m.temp.toFixed(1)}℃`, m.wind != null && `${m.wind.toFixed(1)}m/s`,
                     m.rain_3h != null && `3h ${m.rain_3h.toFixed(1)}mm`, m.humidity != null && `${Math.round(m.humidity)}%`].filter(Boolean).join(' · ');
    const weatherRow = !state.weather ? `<tr><td>기상</td><td class="muted">가산 끔</td></tr>`
      : w.status === 'no_data' || !obsText ? `<tr><td>기상</td><td class="muted">${w.at ?? ''} 관측 없음 (가산 0)</td></tr>`
      : `<tr><td>기상</td><td>${(w.alerts || []).length
          ? w.alerts.map(a => `<b>${a.label} ${a.level === 'warning' ? '경보급' : '주의보급'}</b> ${a.bonus > 0 ? '+' + a.bonus : '<span class="muted">(가산 0)</span>'}`).join(', ')
          : '기준 초과 없음'}<br><span class="muted">${w.name ?? ''}${w.mountain ? '(산지)' : ''} ${(w.dist_m / 1000).toFixed(1)}km · ${obsText}</span></td></tr>`;
    return `<div class="popup"><b>H3 ${d.h3}</b> <span class="muted">${state.date} ${state.hour}시</span><table>
      ${riskRows}
      <tr><td>교통사고(도로)</td><td>${t?.percentile != null ? `백분위 ${t.percentile.toFixed(1)}` : '도로 자료 없음'}${roadSource(t?.detail)}</td></tr>
      ${weatherRow}
      ${fireRows}
    </table><div class="muted" style="margin-top:4px">${r.version ?? ''} · 셀 간 상대 순위, 사고 확률 아님</div></div>`;
  }

  const r = d.dummy || {};
  return `<div class="popup"><b>H3 ${d.h3}</b><table>
    <tr><td>위험도</td><td>${r.score != null ? swatch(r.score) + r.score.toFixed(3) : '-'} (등급 ${r.level ?? '-'} · ${LEVEL_LABELS[r.level] ?? ''})</td></tr>
    <tr><td>출처</td><td>더미(테스트 값)</td></tr>
    <tr><td>구급출동</td><td>${Object.keys(d.ems).length ? Object.entries(d.ems).map(([y, n]) => `${y}년 ${n}건`).join(', ') : '-'}</td></tr>
    <tr><td>혼잡도</td><td>${d.congestion ? d.congestion.value.toFixed(2) + ' (' + d.congestion.source + ')' : '-'}</td></tr>
    ${fireRows}
  </table></div>`;
}

// 위험도 격자는 전용 pane 의 캔버스에 그린다. 멀리서 볼 때(줌 ≤ BLUR_MAX_ZOOM)는 이 pane 에만 블러를 걸어
// 육각형 경계 없이 연속 그라데이션처럼 보이게 하고, 확대하면 블러를 풀고 육각형 테두리를 보여 준다.
// 블러는 화면 표시만 바꾸며 클릭 판정·데이터에는 영향이 없다.
const BLUR_MAX_ZOOM = 10;
map.createPane('risk').style.zIndex = 400;
const riskRenderer = L.canvas({ pane: 'risk', padding: 0.5 });
// 119 마커는 블러가 번지지 않게 위쪽의 별도 pane 에 그린다. SVG 라서 마커 밖 클릭은 아래 격자로 전달된다.
map.createPane('facilities').style.zIndex = 450;
const facRenderer = L.svg({ pane: 'facilities' });

// 셀 지름(약 0.9km)이 화면에서 몇 px 인지에 비례해 블러 강도를 정한다.
function blurPx(zoom) {
  const metersPerPx = 156543.03 * Math.cos(33.4 * Math.PI / 180) / 2 ** zoom;
  return Math.max(2, Math.min(14, 0.9 * 900 / metersPerPx));
}

async function main() {
  const meta = await getJSON('/api/risk/meta');
  state.meta = meta;
  state.hour = hourKST();
  state.date = todayKST();
  // 주소로 바로 열기: /?at=2021-09-14T09:00&weather=off
  const qs = new URLSearchParams(location.search);
  const m = (qs.get('at') || '').match(/^(\d{4}-\d{2}-\d{2})(?:[T ](\d{1,2}))?/);
  if (m) {
    state.date = m[1];
    state.hour = m[2] != null ? +m[2] : 0;
  }
  if (qs.get('weather') === 'off') state.weather = false;
  const [grid, fac] = await Promise.all([
    getJSON('/api/grid' + slotQuery()),
    getJSON('/api/facilities?type=fire_station'),
  ]);
  state.wx = grid.weather;
  state.fall = grid.fall;
  state.features = grid.features;
  state.cmp = { model: 'traffic', dir: 'far', alpha: 0.1, rank: 'rerank', view: 'diff', items: defaultCmpItems() };

  // 비교 모드의 등급 변화 보기는 바뀐 셀이 번지지 않게 블러를 끈다 (가산 후 위험도·가산 크기는 위험도 지도와 같게 블러)
  const smooth = () => !(state.mode === 'compare' && state.cmp.view === 'diff') && map.getZoom() <= BLUR_MAX_ZOOM;
  const styleOf = f => {
    if (state.mode === 'compare') {
      const r = state.cmpRes.get(f.properties.h3), v = state.cmp.view;
      const fill = !r ? NO_DATA_COLOR
        : v === 'diff' ? DIFF_COLORS[String(Math.max(-2, Math.min(2, r.lv1 - r.lv0)))]
        : v === 'bonus' ? scoreColor(state.cmp.alpha ? r.bonus / state.cmp.alpha : 0)
        : scoreColor(r.pct / 100);
      // 등급 변화 보기에서는 그대로인 셀을 옅게 해서 바뀐 셀이 눈에 띄게 한다
      const op = !r ? 0.15 : v === 'diff' && r.lv1 === r.lv0 ? 0.25 : 0.85;
      return { color: '#555', weight: smooth() ? 0 : map.getZoom() <= BLUR_MAX_ZOOM ? 0.1 : 0.3, fillColor: fill, fillOpacity: v === 'diff' ? op : !r ? 0.35 : 0.75 };
    }
    const v = cellValue(f.properties);
    return {
      color: '#555', weight: smooth() ? 0 : 0.3,
      fillColor: v == null ? NO_DATA_COLOR : scoreColor(v),
      fillOpacity: v == null ? 0.35 : 0.75,
    };
  };
  const gridLayer = L.geoJSON(grid, {
    pane: 'risk',
    renderer: riskRenderer,
    style: styleOf,
    onEachFeature: (f, layer) => {
      layer.on('click', async e => {
        L.popup().setLatLng(e.latlng).setContent('불러오는 중…').openOn(map);
        try {
          const html = state.mode === 'compare' ? comparePopup(f.properties.h3) : await cellPopup(f.properties.h3);
          L.popup().setLatLng(e.latlng).setContent(html).openOn(map);
        }
        catch (err) { L.popup().setLatLng(e.latlng).setContent(String(err)).openOn(map); }
      });
    },
  }).addTo(map);

  function applyZoomStyle() {
    map.getPane('risk').style.filter = smooth() ? `blur(${blurPx(map.getZoom()).toFixed(1)}px)` : '';
    gridLayer.setStyle(styleOf);
  }
  map.on('zoomend', applyZoomStyle);
  applyZoomStyle();

  const facLayer = L.geoJSON(fac, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      pane: 'facilities', renderer: facRenderer,
      radius: 6, color: '#fff', weight: 2, fillColor: '#c00', fillOpacity: 1,
    }),
    onEachFeature: (f, layer) => layer.bindPopup(
      `<b>${f.properties.name}</b><br>${f.properties.address}<br><span class="muted">H3 ${f.properties.h3}</span>`),
  }).addTo(map);

  L.control.layers(null, { '위험도 격자 (H3 res8)': gridLayer, '119안전센터': facLayer }, { collapsed: false }).addTo(map);

  // 범례: 종합 위험도는 /api/risk/meta 의 범례 문구·등급 구간을 쓴다.
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = () => L.DomUtil.create('div', 'panel legend');
  legend.addTo(map);
  function weatherLegend() {
    const w = state.wx;
    if (!state.weather || !w || !w.on) return '기상 가산 끔';
    if (w.status === 'no_data') return `기상 ${w.at.replace('T', ' ')} 관측 없음 (가산 0)`;
    return `기상 ${w.at.replace('T', ' ')} · 관측 ${w.stations_observed}곳 · <b>기준 초과 ${w.stations_alerted}곳</b>`;
  }
  function renderLegend() {
    const div = legend.getContainer();
    const bar = `<div class="scale"><div class="bar" style="background:${GRADIENT_CSS}"></div><div class="ticks">`;
    const fire = `<div style="margin-top:6px"><i style="background:#c00;border-radius:50%"></i>119안전센터</div>`;
    if (state.mode === 'compare') {
      const c = state.cmp;
      const body = c.view === 'diff'
        ? [['2', '2단계 이상 ↑'], ['1', '1단계 ↑'], ['0', '그대로'], ['-1', '1단계 ↓'], ['-2', '2단계 이상 ↓']]
            .map(([k, t]) => `<div><i style="background:${DIFF_COLORS[k]}"></i>${t}</div>`).join('')
        : bar + (c.view === 'bonus' ? [`+${c.alpha.toFixed(2)} (최대)`, '', '', '', '+0'] : ['매우 높음', '높음', '보통', '낮음', '매우 낮음'])
            .map(t => `<div>${t}</div>`).join('') + `</div></div>`;
      div.innerHTML = `<h4>시설 가산 비교 · ${{ diff: '등급 변화', result: '가산 후 위험도', bonus: '가산 크기' }[c.view]}</h4>` + body +
        `<div><i style="background:${NO_DATA_COLOR}"></i>${c.model === 'traffic' ? '도로 자료 없음' : '예측 없음'} (비교 제외)</div>` +
        `<div class="muted" style="margin-top:6px">${c.model === 'traffic' ? '교통사고 도로 모델' : '넘어짐·추락 모델'} · 기상 가산 제외<br>` +
        `${c.dir === 'far' ? '시설에서 멀수록' : '시설에 가까울수록'} +α×${c.dir === 'far' ? '(1−지수)' : '지수'} · ${c.rank === 'rerank' ? '순위 다시 매김' : '점수 그대로'}<br>실험 화면 (API 응답은 그대로)</div>`;
      return;
    }
    if (state.mode === 'combined') {
      const traffic = meta.hazards.find(h => h.hazard === 'traffic');
      div.innerHTML = `<h4>${meta.legend}</h4>` + bar +
        ['매우 높음 · 상위 10%', '높음 · 상위 30%', '보통', '낮음 · 하위 30%', '매우 낮음 · 하위 10%'].map(t => `<div>${t}</div>`).join('') +
        `</div></div>` +
        `<div><i style="background:${NO_DATA_COLOR}"></i>도로 자료 없음</div>` + fire +
        `<div class="muted" style="margin-top:6px">교통사고 도로 모델 + 기상 가산<br>도로자료 ${traffic?.snapshot_date ?? '-'}(섬 수치지도 2025)<br>${weatherLegend()}<br>사고 확률 아님 · ${meta.version}</div>`;
    } else {
      div.innerHTML = '<h4>위험도 (더미)</h4>' + bar +
        [5, 4, 3, 2, 1].map(l => `<div>${l} · ${LEVEL_LABELS[l]}</div>`).join('') +
        `</div></div>` + fire +
        `<div class="muted" style="margin-top:6px">테스트 값: 구급출동(2021) 많을수록 ↑<br>혼잡하면 ↓ · 기본 2등급</div>`;
    }
  }

  // 모드 선택
  const controls = L.control({ position: 'topleft' });
  controls.onAdd = () => {
    const div = L.DomUtil.create('div', 'panel controls');
    div.innerHTML = `<h4 id="panel-toggle" style="cursor:pointer" title="접기/펴기">표시 <span class="muted">▾</span></h4><div id="panel-body">
      <label><input type="radio" name="mode" value="combined" checked> 위험도</label>
      <label style="margin-left:18px"><input type="checkbox" id="weather" checked> 기상 가산</label>
      <div class="slot" id="slot">
        <input type="date" id="date"> <button type="button" id="now" title="현재 한국 시각 기준">지금</button><br>
        <input type="range" id="hour" min="0" max="23" step="1"> <b id="hour-label"></b>
      </div>
      <label><input type="radio" name="mode" value="compare"> 시설 가산 비교 (실험)</label>
      <div class="cmp" id="cmp" hidden>
        <div class="row">모델 <select id="cmp-model"><option value="traffic">교통사고</option><option value="fall">넘어짐·추락</option></select>
          보기 <select id="cmp-view"><option value="diff">등급 변화</option><option value="result">가산 후 위험도</option><option value="bonus">가산 크기</option></select></div>
        <div class="presets" id="cmp-presets"></div>
        <div class="row">α <input type="range" id="cmp-alpha" min="0" max="0.3" step="0.01"> <b id="cmp-alpha-label"></b></div>
        <details id="cmp-detail"><summary>세부 설정</summary>
        <div class="row">방향 <select id="cmp-dir"><option value="far">멀수록 가산</option><option value="near">가까울수록 가산</option></select>
          등급 <select id="cmp-rank"><option value="rerank">순위 다시 매김</option><option value="abs">점수 그대로</option></select></div>
        <table id="cmp-items"></table>
        <button type="button" id="cmp-reset">현재 기준(safety_rules.json)으로</button>
        </details>
        <div class="sum" id="cmp-sum"></div>
      </div>
      <label><input type="radio" name="mode" value="dummy"> 더미 (테스트)</label></div>`;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  controls.addTo(map);
  const wxBox = document.getElementById('weather');
  const dateIn = document.getElementById('date');
  const hourIn = document.getElementById('hour');
  const hourLabel = document.getElementById('hour-label');
  const syncSlotUI = () => {
    hourIn.value = state.hour;
    dateIn.value = state.date;
    hourLabel.textContent = `${state.hour}시`;
    // 비교 모드도 날짜는 쓴다(넘어짐 예측 날짜). 기상 가산은 위험도 모드에서만
    const off = state.mode === 'dummy';
    dateIn.disabled = hourIn.disabled = document.getElementById('now').disabled = off;
    wxBox.disabled = state.mode !== 'combined';
    document.getElementById('cmp').hidden = state.mode !== 'compare';
  };
  // 지금 보는 시각·설정을 주소에 남겨 새로고침·공유해도 같은 화면이 나오게 한다
  function syncURL() {
    const q = new URLSearchParams({ at: `${state.date}T${pad2(state.hour)}:00` });
    if (!state.weather) q.set('weather', 'off');
    history.replaceState(null, '', '?' + q.toString());
  }
  const redraw = () => {
    map.closePopup();
    if (state.mode === 'compare') document.getElementById('cmp-sum').innerHTML = compareSummary(computeCompare());
    applyZoomStyle(); renderLegend(); syncSlotUI(); syncURL();
  };
  // 날짜·시각이 바뀌면 그 시각의 격자(기상 가산)를 다시 받는다 (요청이 겹치면 마지막 것만 반영)
  let seq = 0;
  async function reloadSlot() {
    const my = ++seq;
    syncSlotUI();
    const data = await getJSON('/api/grid' + slotQuery());
    if (my !== seq) return;
    map.closePopup();
    state.wx = data.weather;
    state.fall = data.fall;
    state.features = data.features;
    if (state.mode === 'compare') document.getElementById('cmp-sum').innerHTML = compareSummary(computeCompare());
    syncURL();
    gridLayer.clearLayers();
    gridLayer.addData(data);
    applyZoomStyle();
    renderLegend();
  }
  document.querySelectorAll('input[name=mode]').forEach(el => el.addEventListener('change', () => {
    state.mode = el.value;
    redraw();
  }));
  wxBox.addEventListener('change', () => { state.weather = wxBox.checked; reloadSlot(); });
  dateIn.addEventListener('change', () => {
    if (!dateIn.value) return;
    state.date = dateIn.value;
    reloadSlot();
  });
  hourIn.addEventListener('input', () => { hourLabel.textContent = `${hourIn.value}시`; });
  hourIn.addEventListener('change', () => { state.hour = +hourIn.value; reloadSlot(); });
  document.getElementById('now').addEventListener('click', () => {
    state.hour = hourKST();
    state.date = todayKST();
    reloadSlot();
  });
  // 시설 가산 비교 컨트롤
  const cmpEl = id => document.getElementById('cmp-' + id);
  function renderCmpItems() {
    cmpEl('items').innerHTML = `<tr class="muted"><td></td><td>만점</td><td>0점</td><td></td></tr>` +
      state.meta.safety.items.map(it => {
        const o = state.cmp.items[it.key];
        return `<tr><td><label><input type="checkbox" data-k="${it.key}" data-f="on"${o.on ? ' checked' : ''}> ${it.label.replace(/\(.*\)/, '')}</label></td>
          <td><input type="number" data-k="${it.key}" data-f="full" value="${o.full}"></td>
          <td><input type="number" data-k="${it.key}" data-f="zero" value="${o.zero}"></td>
          <td class="muted">${UNIT[it.metric] ?? ''}</td></tr>`;
      }).join('');
  }
  function syncCmpUI() {
    const c = state.cmp;
    cmpEl('model').value = c.model; cmpEl('view').value = c.view; cmpEl('dir').value = c.dir; cmpEl('rank').value = c.rank;
    cmpEl('alpha').value = c.alpha; cmpEl('alpha-label').textContent = c.alpha.toFixed(2);
  }
  for (const k of ['model', 'view', 'dir', 'rank']) cmpEl(k).addEventListener('change', e => { state.cmp[k] = e.target.value; redraw(); });
  cmpEl('alpha').addEventListener('input', e => { state.cmp.alpha = +e.target.value; cmpEl('alpha-label').textContent = state.cmp.alpha.toFixed(2); redraw(); });
  cmpEl('items').addEventListener('change', e => {
    const { k, f } = e.target.dataset;
    if (!k) return;
    const o = state.cmp.items[k];
    if (f === 'on') o.on = e.target.checked;
    else if (e.target.value !== '' && Number.isFinite(+e.target.value)) o[f] = +e.target.value;
    if (o.full === o.zero) { o[f] += f === 'full' ? -1 : 1; e.target.value = o[f]; } // 0 으로 나누기 방지
    redraw();
  });
  cmpEl('reset').addEventListener('click', () => { state.cmp.items = defaultCmpItems(); renderCmpItems(); redraw(); });
  // 분석에서 비교한 조건들 (멀수록 가산, 순위 다시 매김). 누르면 그 조건의 지도로 바뀐다
  const PRESETS = [
    ['모델만', { alpha: 0 }],
    ['α 0.05', { alpha: 0.05 }],
    ['α 0.1', { alpha: 0.1 }],
    ['α 0.2', { alpha: 0.2 }],
    ['경찰서 2→5km', { alpha: 0.1, items: { police: { full: 2000, zero: 5000 } } }],
    ['119 5→10분', { alpha: 0.1, items: { fire_station: { full: 5, zero: 10 } } }],
    ['119·응급실만', { alpha: 0.1, only: ['fire_station', 'er'] }],
  ];
  cmpEl('presets').innerHTML = PRESETS.map(([t], i) => `<button type="button" data-i="${i}">${t}</button>`).join('');
  cmpEl('presets').addEventListener('click', e => {
    const i = e.target.dataset.i;
    if (i == null) return;
    const [, p] = PRESETS[i];
    const items = defaultCmpItems();
    for (const [k, o] of Object.entries(p.items ?? {})) Object.assign(items[k], o);
    if (p.only) for (const k in items) items[k].on = p.only.includes(k);
    Object.assign(state.cmp, { dir: 'far', rank: 'rerank', alpha: p.alpha, items });
    cmpEl('presets').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target));
    renderCmpItems(); syncCmpUI(); redraw();
  });
  // 세부 설정을 직접 바꾸면 프리셋 강조를 끈다
  cmpEl('detail').addEventListener('change', () => cmpEl('presets').querySelectorAll('button').forEach(b => b.classList.remove('on')));
  document.getElementById('panel-toggle').addEventListener('click', () => {
    const b = document.getElementById('panel-body');
    b.hidden = !b.hidden;
  });
  renderCmpItems();
  syncCmpUI();

  wxBox.checked = state.weather;
  syncSlotUI();
  syncURL();
  renderLegend();
}

main().catch(err => {
  const div = document.createElement('div');
  div.className = 'panel';
  div.style.cssText = 'position:absolute;top:10px;left:50px;z-index:1000;color:#c00';
  div.textContent = '데이터 로드 실패: ' + err.message + ' (서버와 DB가 떠 있는지 확인)';
  document.body.appendChild(div);
});
</script>
</body>
</html>
