<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제주 위험도 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .panel {
      background: #fff; padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 13px; line-height: 1.5;
    }
    .panel h4 { margin: 0 0 6px; font-size: 14px; }
    .legend .scale { display: flex; gap: 8px; margin-bottom: 4px; }
    .legend .bar { width: 14px; height: 130px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .legend .ticks { display: flex; flex-direction: column; justify-content: space-between; height: 130px; }
    .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .muted { color: #666; font-size: 12px; }
    .popup table { border-collapse: collapse; }
    .popup td { padding: 1px 6px 1px 0; }
    .popup td:first-child { color: #666; }
    .controls label { display: block; cursor: pointer; }
    .controls input[type=date] { margin-top: 4px; font: inherit; }
    .controls input[type=date]:disabled { opacity: .4; }
    @media (max-width: 650px) {
      .leaflet-control.legend { margin-bottom: 260px; max-height: 100px; overflow-y: auto; max-width: 180px; }
    }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 위험도 점수(0~1) → 색 그라데이션. 각 등급 구간(0.2 간격)의 가운데에 기준색을 둔다.
// 등급 경계(0.2 간격)는 internal/geo/ems.go LevelFromScore 와 맞출 것.
const COLOR_STOPS = [
  [0.1, '#fffbe5'], [0.3, '#ffeeb3'], [0.5, '#fee08b'], [0.7, '#fc8d59'], [0.9, '#d73027'],
];
const LEVEL_LABELS = { 1: '매우 낮음', 2: '낮음', 3: '보통', 4: '높음', 5: '매우 높음' };

const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function scoreColor(score) {
  if (score == null) return '#ccc';
  const s = Math.max(COLOR_STOPS[0][0], Math.min(COLOR_STOPS.at(-1)[0], score));
  for (let i = 1; i < COLOR_STOPS.length; i++) {
    const [s1, c1] = COLOR_STOPS[i];
    if (s <= s1) {
      const [s0, c0] = COLOR_STOPS[i - 1];
      const t = (s - s0) / (s1 - s0);
      const [a, b] = [hexToRgb(c0), hexToRgb(c1)];
      return `rgb(${a.map((v, k) => Math.round(v + t * (b[k] - v))).join(',')})`;
    }
  }
  return COLOR_STOPS.at(-1)[1];
}
const GRADIENT_CSS = `linear-gradient(to top, ${COLOR_STOPS.map(([s, c]) => `${c} ${s * 100}%`).join(', ')})`;

const map = L.map('map', { preferCanvas: true }).setView([33.38, 126.55], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

const fmtDist = m => m == null ? '-' : (m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m');

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' → HTTP ' + res.status);
  return res.json();
}

// 표시 모드: dummy = 더미 위험도(구급출동·혼잡도), model = 교통사고 ML 모델의 선택 날짜 상대 순위
const state = { mode: 'dummy', date: null, meta: null };

// 셀 색에 쓰는 0~1 값. 모델은 백분위(0~100)를 0~1 로.
const cellValue = p => state.mode === 'model'
  ? (p.model_percentile == null ? null : p.model_percentile / 100)
  : p.score;

// 교통사고 모델 백분위 → 그날 상대 위험 구간 (범례의 상위 10%·30%·중간·하위 30%·10% 와 같은 경계)
function modelBand(p) {
  if (p >= 90) return '매우 높음';
  if (p >= 70) return '높음';
  if (p >= 30) return '보통';
  if (p >= 10) return '낮음';
  return '매우 낮음';
}
const swatch = v => `<i style="display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);background:${scoreColor(v)}"></i>`;

async function cellPopup(h3) {
  const isModel = state.mode === 'model';
  const d = await getJSON('/api/cells/' + h3 + (isModel && state.date ? `?date=${state.date}` : ''));
  const fs = d.facilities.fire_station || {};
  const fireRows = `
    <tr><td>119 도착</td><td>약 ${fs.nearest_drive_min ?? '-'}분 <span class="muted">(직선 ${fmtDist(fs.nearest_dist_m)})</span></td></tr>
    <tr><td>셀 내 119</td><td>${fs.count_in_cell ?? 0}곳 (인접 포함 ${fs.count_k1 ?? 0}곳)</td></tr>`;

  // 교통사고 모델 모드: 모델이 산출한 그날 위험도만 보여 준다(더미 값은 숨김). 색은 지도와 같은 백분위 기준.
  if (isModel) {
    const m = d.model;
    const top = m ? 100 - m.percentile : null;
    const riskRow = m
      ? `<tr><td>위험도</td><td>${swatch(m.percentile / 100)}<b>${modelBand(m.percentile)}</b> · ${top < 0.1 ? '최상위' : `상위 ${top.toFixed(1)}%`}</td></tr>
         <tr><td>백분위</td><td>${m.percentile.toFixed(1)} <span class="muted">(그날 3,651셀 중 순위)</span></td></tr>
         <tr><td>모델 점수</td><td>${m.score.toFixed(4)} <span class="muted">(날짜 간 비교용 아님)</span></td></tr>`
      : `<tr><td>위험도</td><td>데이터 없음</td></tr>`;
    return `<div class="popup"><b>H3 ${d.h3}</b> <span class="muted">${state.date}</span><table>
      ${riskRow}
      ${fireRows}
    </table><div class="muted" style="margin-top:4px">교통사고 모델 ${m?.version ?? ''} · 선택 날짜의 상대 위험 순위, 사고 확률 아님</div></div>`;
  }

  const r = d.risk || {};
  return `<div class="popup"><b>H3 ${d.h3}</b><table>
    <tr><td>위험도</td><td>${r.score != null ? swatch(r.score) + r.score.toFixed(3) : '-'} (등급 ${r.level ?? '-'} · ${LEVEL_LABELS[r.level] ?? ''})</td></tr>
    <tr><td>출처</td><td>더미(테스트 값)</td></tr>
    <tr><td>구급출동</td><td>${Object.keys(d.ems).length ? Object.entries(d.ems).map(([y, n]) => `${y}년 ${n}건`).join(', ') : '-'}</td></tr>
    <tr><td>혼잡도</td><td>${d.congestion ? d.congestion.value.toFixed(2) + ' (' + d.congestion.source + ')' : '-'}</td></tr>
    ${fireRows}
  </table></div>`;
}

// 위험도 격자는 전용 pane 의 캔버스에 그린다. 멀리서 볼 때(줌 ≤ BLUR_MAX_ZOOM)는 이 pane 에만 블러를 걸어
// 육각형 경계 없이 연속 그라데이션처럼 보이게 하고, 확대하면 블러를 풀고 육각형 테두리를 보여 준다.
// 블러는 화면 표시만 바꾸며 클릭 판정·데이터에는 영향이 없다.
const BLUR_MAX_ZOOM = 10;
map.createPane('risk').style.zIndex = 400;
const riskRenderer = L.canvas({ pane: 'risk', padding: 0.5 });
// 119 마커는 블러가 번지지 않게 위쪽의 별도 pane 에 그린다. SVG 라서 마커 밖 클릭은 아래 격자로 전달된다.
map.createPane('facilities').style.zIndex = 450;
const facRenderer = L.svg({ pane: 'facilities' });

// 셀 지름(약 0.9km)이 화면에서 몇 px 인지에 비례해 블러 강도를 정한다.
function blurPx(zoom) {
  const metersPerPx = 156543.03 * Math.cos(33.4 * Math.PI / 180) / 2 ** zoom;
  return Math.max(2, Math.min(14, 0.9 * 900 / metersPerPx));
}

async function main() {
  const [grid, fac, meta] = await Promise.all([
    getJSON('/api/grid'),
    getJSON('/api/facilities?type=fire_station'),
    fetch('/api/model-risk/meta').then(r => r.ok ? r.json() : null),
  ]);
  state.meta = meta;
  state.date = meta?.date_end ?? null;

  const smooth = () => map.getZoom() <= BLUR_MAX_ZOOM;
  const gridLayer = L.geoJSON(grid, {
    pane: 'risk',
    renderer: riskRenderer,
    style: f => ({
      color: '#555', weight: smooth() ? 0 : 0.3,
      fillColor: scoreColor(cellValue(f.properties)), fillOpacity: 0.75,
    }),
    onEachFeature: (f, layer) => {
      layer.on('click', async e => {
        L.popup().setLatLng(e.latlng).setContent('불러오는 중…').openOn(map);
        try { L.popup().setLatLng(e.latlng).setContent(await cellPopup(f.properties.h3)).openOn(map); }
        catch (err) { L.popup().setLatLng(e.latlng).setContent(String(err)).openOn(map); }
      });
    },
  }).addTo(map);
  let gridData = grid;

  function applyZoomStyle() {
    map.getPane('risk').style.filter = smooth() ? `blur(${blurPx(map.getZoom()).toFixed(1)}px)` : '';
    gridLayer.setStyle(f => ({ weight: smooth() ? 0 : 0.3 }));
  }
  map.on('zoomend', applyZoomStyle);
  applyZoomStyle();

  const facLayer = L.geoJSON(fac, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      pane: 'facilities', renderer: facRenderer,
      radius: 6, color: '#fff', weight: 2, fillColor: '#c00', fillOpacity: 1,
    }),
    onEachFeature: (f, layer) => layer.bindPopup(
      `<b>${f.properties.name}</b><br>${f.properties.address}<br><span class="muted">H3 ${f.properties.h3}</span>`),
  }).addTo(map);

  L.control.layers(null, { '위험도 격자 (H3 res8)': gridLayer, '119안전센터': facLayer }, { collapsed: false }).addTo(map);

  // 범례: 모드에 따라 문구가 바뀐다. 모델은 인수인계서 권장 문구("선택 날짜의 상대 위험 순위")를 쓴다.
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = () => L.DomUtil.create('div', 'panel legend');
  legend.addTo(map);
  function renderLegend() {
    const div = legend.getContainer();
    const bar = `<div class="scale"><div class="bar" style="background:${GRADIENT_CSS}"></div><div class="ticks">`;
    const fire = `<div style="margin-top:6px"><i style="background:#c00;border-radius:50%"></i>119안전센터</div>`;
    if (state.mode === 'model') {
      div.innerHTML = `<h4>${meta.legend}</h4>` + bar +
        ['매우 높음 · 상위 10%', '높음 · 상위 30%', '보통', '낮음 · 하위 30%', '매우 낮음 · 하위 10%'].map(t => `<div>${t}</div>`).join('') +
        `</div></div>` + fire +
        `<div class="muted" style="margin-top:6px">${state.date} · ${meta.version}<br>2011~2021 과거 점수 · 사고 확률 아님<br>같은 순위라도 날짜 간 절대 위험은 다름</div>`;
    } else {
      const ts = gridData.features.find(f => f.properties.ts)?.properties.ts;
      div.innerHTML = '<h4>위험도</h4>' + bar +
        [5, 4, 3, 2, 1].map(l => `<div>${l} · ${LEVEL_LABELS[l]}</div>`).join('') +
        `</div></div>` + fire +
        `<div class="muted" style="margin-top:6px">더미: 구급출동(2021) 많을수록 ↑<br>혼잡하면 ↓ · 기본 2등급<br>셀 ${gridData.features.length}개 · ${ts ? new Date(ts).toLocaleString('ko-KR') : ''}</div>`;
    }
  }

  // 모드·날짜 선택
  const controls = L.control({ position: 'topleft' });
  controls.onAdd = () => {
    const div = L.DomUtil.create('div', 'panel controls');
    div.innerHTML = `<h4>표시</h4>
      <label><input type="radio" name="mode" value="dummy" checked> 더미 위험도</label>
      <label><input type="radio" name="mode" value="model" ${meta ? '' : 'disabled'}> 교통사고 모델 (날짜별)</label>
      <input type="date" id="model-date" ${meta ? `min="${meta.date_start}" max="${meta.date_end}" value="${state.date}"` : ''} disabled>
      ${meta ? '' : '<div class="muted">모델 점수 미적재</div>'}`;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  controls.addTo(map);
  const dateInput = document.getElementById('model-date');

  async function reload() {
    const q = state.mode === 'model' ? `?date=${state.date}` : '';
    try {
      gridData = await getJSON('/api/grid' + q);
    } catch (err) {
      alert(`${state.date}: 데이터 없음 (${meta.date_start} ~ ${meta.date_end})`);
      return;
    }
    map.closePopup();
    gridLayer.clearLayers();
    gridLayer.addData(gridData);
    applyZoomStyle();
    renderLegend();
  }
  document.querySelectorAll('input[name=mode]').forEach(el => el.addEventListener('change', () => {
    state.mode = el.value;
    dateInput.disabled = state.mode !== 'model';
    reload();
  }));
  dateInput.addEventListener('change', () => {
    if (!dateInput.value) return;
    state.date = dateInput.value;
    reload();
  });
  renderLegend();

  const population = L.control({ position: 'bottomleft' });
  let populationCircle;
  let populationRevision = 0;
  population.onAdd = () => {
    const div = L.DomUtil.create('div', 'panel');
    div.style.maxWidth = '330px';
    div.innerHTML = '<h4>주변 실시간 인구 · SKT</h4><div style="margin-bottom:8px">📍 파란 핀을 드래그하거나 지도를 클릭하세요.</div><input id="pop-lng" type="hidden" value="126.7324712"><input id="pop-lat" type="hidden" value="33.4982282"><label>반경(m) <input id="pop-radius" type="number" min="500" max="2000" step="50" value="1450" style="width:75px"></label> <button id="pop-load">인구 조회</button><div id="pop-result" style="margin-top:6px">핀 위치의 인구를 조회하세요.</div><div class="muted">모델은 선택한 과거 날짜, 인구는 현재 집계 기준.<br>주변 인구는 산책로 보행자 수와 다를 수 있습니다.</div>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  population.addTo(map);
  const populationPin = L.marker([33.4982282, 126.7324712], {
    draggable: true, autoPan: true, title: '인구 조회 위치 · 드래그해서 이동',
    alt: '인구 조회 위치 핀', zIndexOffset: 1000
  }).addTo(map);
  populationPin.bindTooltip('드래그해서 조회 위치 이동', {direction:'top'});
  populationCircle = L.circle(populationPin.getLatLng(), {radius:1450, color:'#2563eb', fillOpacity:0.06, interactive:false}).addTo(map);
  function movePopulationPin(latlng) {
    populationRevision++;
    populationPin.setLatLng(latlng);
    populationCircle.setLatLng(latlng);
    document.getElementById('pop-lng').value = latlng.lng.toFixed(6);
    document.getElementById('pop-lat').value = latlng.lat.toFixed(6);
    document.getElementById('pop-result').textContent = '조회 위치 변경됨 · 인구 조회를 눌러주세요.';
  }
  map.on('click', e => movePopulationPin(e.latlng));
  populationPin.on('drag', e => movePopulationPin(e.target.getLatLng()));
  document.getElementById('pop-radius').addEventListener('input', e => {
    populationRevision++;
    const radius = Number(e.target.value);
    if (Number.isFinite(radius) && radius >= 500 && radius <= 2000 && radius % 50 === 0) populationCircle.setRadius(radius);
    document.getElementById('pop-result').textContent = '조회 반경 변경됨 · 인구 조회를 눌러주세요.';
  });
  document.getElementById('pop-load').addEventListener('click', async () => {
    const button = document.getElementById('pop-load');
    const output = document.getElementById('pop-result');
    const radiusInput = document.getElementById('pop-radius');
    if (!radiusInput.reportValidity()) return;
    button.disabled = true; output.textContent = '조회 중…';
    const revision = populationRevision;
    try {
      const params = new URLSearchParams({lng: document.getElementById('pop-lng').value, lat: document.getElementById('pop-lat').value, radius: document.getElementById('pop-radius').value});
      const response = await fetch('/api/population/live?' + params);
      const data = await response.json();
      if (revision !== populationRevision) return;
      if (!response.ok) throw new Error(data.error || '조회 실패');
      const observed = new Date(data.observed_at);
      const old = Date.now() - observed.getTime() > 30 * 60 * 1000;
      const lines = [`반경 ${data.radius_m.toLocaleString()}m · 전체 ${data.total.toLocaleString()}명`, `도민 ${data.residents.toLocaleString()}명 · 관광객 ${data.visitors.toLocaleString()}명`, `집계: ${observed.toLocaleString('ko-KR', {timeZone:'Asia/Seoul'})}${old ? ' · 오래된 집계' : ''}`, data.cached ? '캐시 응답 (최대 5분)' : '플랫폼에서 새로 조회'];
      output.replaceChildren(...lines.map(text => {const line = document.createElement('div'); line.textContent = text; return line;}));
      populationCircle.setLatLng([data.lat, data.lng]).setRadius(data.radius_m);
    } catch(err) {if (revision === populationRevision) output.textContent = '인구 확인 불가: ' + err.message;}
    finally {button.disabled = false;}
  });
}

main().catch(err => {
  const div = document.createElement('div');
  div.className = 'panel';
  div.style.cssText = 'position:absolute;top:10px;left:50px;z-index:1000;color:#c00';
  div.textContent = '데이터 로드 실패: ' + err.message + ' (서버와 DB가 떠 있는지 확인)';
  document.body.appendChild(div);
});
</script>
</body>
</html>
